
services:
  # --- Redis Cache ---
  redis:
    image: redis:8-alpine
    container_name: shared_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # loopback only: apps reach it via infrastructure_network
    # Enforcing a password and memory limits as discussed in best practices
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - infrastructure_network

  # --- MySQL Database ---
  mysql:
    image: mysql:8.4 # LTS; 8.0 reached end-of-life April 2026
    container_name: shared_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306" # loopback only: apps reach it via infrastructure_network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - infrastructure_network

# --- Persistent Volumes ---
# These ensure your databases don't wipe when the containers restart
volumes:
  redis_data:
  mysql_data:

# --- Shared Network ---
networks:
  infrastructure_network:
    name: infrastructure_network
    driver: bridge